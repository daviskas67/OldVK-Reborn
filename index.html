<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OldVK — с комментариями</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #edeef0; min-height: 100vh; }
        .header { background: #507299; background: linear-gradient(to bottom, #638ab5 0%, #4a6a8f 100%); border-bottom: 1px solid #3a5a7e; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; }
        .header-container { max-width: 980px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo { font-size: 24px; font-weight: bold; color: white; text-shadow: 1px 1px 0 #3a5a7e; text-decoration: none; cursor: pointer; }
        .shapka-img { max-height: 40px; border-radius: 4px; }
        .search-box { background: #405d7a; border-radius: 16px; padding: 6px 12px; border: none; color: white; width: 200px; }
        .container { max-width: 980px; margin: 0 auto; padding: 70px 16px 20px; display: flex; gap: 20px; flex-wrap: wrap; }
        .sidebar { width: 220px; flex-shrink: 0; }
        .menu-item { background: white; padding: 12px 16px; margin-bottom: 2px; color: #2a5885; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 10px; }
        .menu-item:hover { background: #e1e9f5; }
        .content { flex: 1; min-width: 280px; }
        .card { background: white; border-radius: 4px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .card-header { padding: 16px; border-bottom: 1px solid #e7e8ec; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #e1e9f5; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .author-name { font-weight: bold; color: #2a5885; }
        .post-date { font-size: 12px; color: #93979f; }
        .post-content { padding: 16px; line-height: 1.5; color: #2c3e50; }
        .post-actions { padding: 12px 16px; border-top: 1px solid #e7e8ec; display: flex; gap: 20px; }
        .action-btn { color: #93979f; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .action-btn:hover { color: #507299; }
        .form-group { margin-bottom: 16px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; }
        .btn { background: #507299; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #3a5a7e; }
        .right-panel { width: 220px; flex-shrink: 0; }
        .widget { background: white; border-radius: 4px; padding: 16px; margin-bottom: 16px; }
        .widget-title { font-weight: bold; margin-bottom: 12px; color: #2a5885; }
        .comments-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #e7e8ec; }
        .comment { padding: 12px 0; border-bottom: 1px solid #e7e8ec; display: flex; gap: 10px; }
        .comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: #e1e9f5; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .comment-content { flex: 1; }
        .comment-author { font-weight: bold; font-size: 13px; color: #2a5885; }
        .comment-text { font-size: 13px; margin-top: 4px; }
        .comment-date { font-size: 11px; color: #93979f; margin-top: 4px; }
        .notif-badge { background: #e06a6a; color: white; border-radius: 12px; padding: 2px 8px; font-size: 12px; margin-left: 8px; }
        .comment-input-area { display: flex; gap: 8px; margin-top: 12px; }
        .comment-input-area input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-container">
        <div class="logo-area">
            <a href="#" class="logo" onclick="loadFeed(); return false;">OldVK</a>
            <img src="shapka.jpg" class="shapka-img" alt="OldVK" onerror="this.style.display='none'">
        </div>
        <input type="text" class="search-box" placeholder="Поиск людей" id="searchInput" onkeypress="if(event.key==='Enter') searchUsers()">
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <div class="menu-item" onclick="loadFeed()">📱 Моя страница</div>
        <div class="menu-item" onclick="loadFeed()">📰 Новости</div>
        <div class="menu-item" onclick="loadDialogs()">💬 Сообщения</div>
        <div class="menu-item" onclick="showSearchPage()">🔍 Поиск</div>
        <div class="menu-item" onclick="showNotifications()">🔔 Уведомления</div>
        <div class="menu-item" onclick="showAuthForm()">🔐 Вход/Регистрация</div>
    </div>
    
    <div class="content" id="content">
        <div class="card">
            <div class="card-header">
                <div class="avatar">📱</div>
                <div class="author-info">
                    <div class="author-name">OldVK</div>
                    <div class="post-date">Добро пожаловать!</div>
                </div>
            </div>
            <div class="post-content">
                <p>✨ Теперь с комментариями и уведомлениями!</p>
                <p>🔐 <a href="#" onclick="showAuthForm(); return false;">Авторизуйтесь</a></p>
            </div>
        </div>
    </div>
    
    <div class="right-panel">
        <div class="widget">
            <div class="widget-title">💡 Советы</div>
            <div>• Комментируйте посты<br>• Получайте уведомления<br>• Общайтесь</div>
        </div>
        <div class="widget" id="statsWidget">
            <div class="widget-title">📊 Статус</div>
            <div>Загрузка...</div>
        </div>
    </div>
</div>

<script>
    let token = localStorage.getItem('oldvk_token');
    let userId = localStorage.getItem('oldvk_user_id');
    let currentChatUserId = null;

    async function apiCall(endpoint, method = 'GET', data = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        const options = { method, headers };
        if (data) options.body = JSON.stringify(data);
        try {
            const resp = await fetch(`/api${endpoint}`, options);
            return await resp.json();
        } catch(e) { return { error: 'Сервер не отвечает' }; }
    }

    function showLoading() { document.getElementById('content').innerHTML = '<div class="card" style="padding:40px;text-align:center">⏳ Загрузка...</div>'; }

    async function loadFeed() {
        if (!token) { showAuthForm(); return; }
        showLoading();
        const res = await apiCall('/feed');
        if (res.posts) renderFeed(res.posts);
    }

    function renderFeed(posts) {
        let html = '<div>';
        html += `<div class="card"><div class="card-header"><div class="avatar">✏️</div><div class="author-info"><div class="author-name">Новый пост</div></div></div>
                 <div class="post-content"><textarea id="postContent" rows="3" placeholder="Что у вас нового?" style="width:100%"></textarea>
                 <button class="btn" style="margin-top:12px" onclick="createPost()">📝 Опубликовать</button></div></div>`;
        for (let p of posts) {
            html += `<div class="card" id="post-${p.id}">
                <div class="card-header">
                    <div class="avatar">${p.avatar || '👤'}</div>
                    <div class="author-info">
                        <div class="author-name">${p.first_name || p.username} ${p.last_name || ''}</div>
                        <div class="post-date">${p.date ? new Date(p.date).toLocaleString() : 'Только что'}</div>
                    </div>
                </div>
                <div class="post-content">${p.content}</div>
                <div class="post-actions">
                    <div class="action-btn" onclick="likePost(${p.id})">❤️ <span id="likes-${p.id}">${p.likes || 0}</span></div>
                    <div class="action-btn" onclick="toggleComments(${p.id})">💬 Комментарии (<span id="comments-count-${p.id}">${p.comments_count || 0}</span>)</div>
                </div>
                <div class="comments-section" id="comments-${p.id}" style="display:none; padding:16px;">
                    <div id="comments-list-${p.id}"></div>
                    <div class="comment-input-area">
                        <input type="text" id="comment-input-${p.id}" placeholder="Написать комментарий...">
                        <button class="btn" style="padding:8px 16px;" onclick="addComment(${p.id})">→</button>
                    </div>
                </div>
            </div>`;
        }
        html += '</div>';
        document.getElementById('content').innerHTML = html;
        loadUnreadCount();
    }

    async function createPost() {
        const content = document.getElementById('postContent').value;
        if (!content) return;
        const res = await apiCall('/post/create', 'POST', { token, content });
        if (res.success) { document.getElementById('postContent').value = ''; loadFeed(); }
        else alert('Ошибка');
    }

    async function likePost(postId) {
        const res = await apiCall('/like', 'POST', { token, post_id: postId });
        if (res.success) {
            document.getElementById(`likes-${postId}`).innerText = res.likes;
        }
    }

    async function toggleComments(postId) {
        const commentsDiv = document.getElementById(`comments-${postId}`);
        if (commentsDiv.style.display === 'none') {
            commentsDiv.style.display = 'block';
            await loadComments(postId);
        } else {
            commentsDiv.style.display = 'none';
        }
    }

    async function loadComments(postId) {
        const res = await apiCall(`/comments?post_id=${postId}`);
        const container = document.getElementById(`comments-list-${postId}`);
        if (res.comments && res.comments.length) {
            let html = '';
            for (let c of res.comments) {
                const date = c.date ? new Date(c.date).toLocaleString() : '';
                html += `<div class="comment">
                            <div class="comment-avatar">${c.avatar || '👤'}</div>
                            <div class="comment-content">
                                <div class="comment-author">${c.first_name || c.username}</div>
                                <div class="comment-text">${escapeHtml(c.content)}</div>
                                <div class="comment-date">${date}</div>
                            </div>
                         </div>`;
            }
            container.innerHTML = html;
        } else {
            container.innerHTML = '<div style="color:#999; text-align:center; padding:12px;">Нет комментариев. Будьте первым!</div>';
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function addComment(postId) {
        const input = document.getElementById(`comment-input-${postId}`);
        const content = input.value.trim();
        if (!content) return;
        const res = await apiCall('/comment', 'POST', { token, post_id: postId, content });
        if (res.success) {
            input.value = '';
            document.getElementById(`comments-count-${postId}`).innerText = res.comments_count;
            await loadComments(postId);
        } else {
            alert('Ошибка при отправке комментария');
        }
    }

    async function loadUnreadCount() {
        const res = await apiCall('/messages/unread');
        if (res.notifications > 0) {
            document.title = `📬 OldVK (${res.notifications})`;
        }
    }

    async function showNotifications() {
        showLoading();
        const res = await apiCall('/notifications');
        if (res.notifications) {
            let html = '<div class="card"><div class="card-header"><div class="avatar">🔔</div><div class="author-info"><div class="author-name">Уведомления</div></div></div><div class="post-content">';
            if (res.notifications.length === 0) {
                html += '<p>Нет уведомлений</p>';
            }
            for (let n of res.notifications) {
                let text = '';
                if (n.type === 'like') text = `❤️ ${n.from_user.first_name || n.from_user.username} поставил(а) лайк вашему посту`;
                if (n.type === 'comment') text = `💬 ${n.from_user.first_name || n.from_user.username} прокомментировал(а) ваш пост`;
                html += `<div style="padding:12px; border-bottom:1px solid #eee; ${!n.read ? 'background:#fff4e5;' : ''}">
                            ${text}<br><small>${new Date(n.date).toLocaleString()}</small>
                         </div>`;
            }
            html += '</div></div>';
            document.getElementById('content').innerHTML = html;
            await apiCall('/notifications/read', 'POST', { token });
            loadUnreadCount();
        }
    }

    async function loadDialogs() {
        if (!token) { showAuthForm(); return; }
        showLoading();
        const res = await apiCall('/messages/dialogs');
        if (res.dialogs) renderDialogs(res.dialogs);
    }

    function renderDialogs(dialogs) {
        let html = `<div class="card"><div class="card-header"><div class="avatar">💬</div><div class="author-info"><div class="author-name">Диалоги</div></div></div><div class="post-content">`;
        for (let d of dialogs) {
            html += `<div style="padding:12px; border-bottom:1px solid #eee; cursor:pointer" onclick="openChat(${d.id})">
                        <strong>${d.first_name || d.username}</strong><br>
                        <small>${d.last_message || '...'}</small>
                        ${d.unread ? `<span class="notif-badge">${d.unread}</span>` : ''}
                     </div>`;
        }
        html += '</div></div>';
        document.getElementById('content').innerHTML = html;
    }

    async function openChat(otherId) {
        currentChatUserId = otherId;
        await apiCall('/messages/read', 'POST', { token, other_id: otherId });
        showLoading();
        const res = await apiCall(`/messages/with?user_id=${otherId}`);
        if (res.messages) renderChat(res.messages, res.other_id);
    }

    function renderChat(messages, otherId) {
        fetch(`/api/users/info?user_id=${otherId}`, { headers: { 'Authorization': `Bearer ${token}` } })
            .then(r => r.json()).then(data => {
                const otherName = data.user ? (data.user.first_name || data.user.username) : 'Пользователь';
                let html = `<div class="card">
                    <div class="card-header"><div class="avatar">💬</div><div class="author-info"><div class="author-name">Чат с ${otherName}</div></div>
                    <button class="btn" style="width:auto; padding:6px 12px" onclick="loadDialogs()">Назад</button></div>
                    <div id="chatMessages" style="height:400px; overflow-y:auto; padding:16px;">`;
                for (let m of messages) {
                    const isMine = m.from_id == userId;
                    html += `<div style="padding:8px; margin-bottom:8px; text-align:${isMine ? 'right' : 'left'}">
                                <strong>${isMine ? 'Я' : (m.first_name || m.username)}</strong>: ${escapeHtml(m.text)}<br>
                                <small>${m.date ? new Date(m.date).toLocaleTimeString() : ''}</small>
                            </div>`;
                }
                html += `</div><div style="display:flex; gap:8px; padding:12px; border-top:1px solid #e7e8ec;">
                         <input type="text" id="messageInput" placeholder="Сообщение..." style="flex:1; padding:8px;">
                         <button class="btn" onclick="sendMessage(${otherId})">Отправить</button>
                         </div></div>`;
                document.getElementById('content').innerHTML = html;
                const msgDiv = document.getElementById('chatMessages');
                if (msgDiv) msgDiv.scrollTop = msgDiv.scrollHeight;
                document.getElementById('messageInput').focus();
            });
    }

    async function sendMessage(toId) {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        const res = await apiCall('/messages/send', 'POST', { token, to_id: toId, text });
        if (res.success) {
            input.value = '';
            openChat(toId);
        }
    }

    async function searchUsers() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;
        const res = await apiCall(`/users/search?q=${encodeURIComponent(query)}`);
        if (res.users) {
            let html = '<div class="card"><div class="card-header"><div class="avatar">🔍</div><div class="author-info"><div class="author-name">Результаты поиска</div></div></div><div class="post-content">';
            for (let u of res.users) {
                html += `<div style="padding:12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between">
                            <strong>${u.first_name || u.username} ${u.last_name || ''}</strong>
                            <button class="btn" style="padding:4px 12px;" onclick="openChat(${u.id})">Написать</button>
                         </div>`;
            }
            html += '</div></div>';
            document.getElementById('content').innerHTML = html;
        }
    }

    function showSearchPage() {
        document.getElementById('searchInput').focus();
        searchUsers();
    }

    function showAuthForm() {
        document.getElementById('content').innerHTML = `
            <div class="card">
                <div class="card-header"><div class="avatar">🔐</div><div class="author-info"><div class="author-name">Вход в OldVK</div></div></div>
                <div class="post-content">
                    <div class="form-group"><input type="text" id="loginUsername" placeholder="Логин"></div>
                    <div class="form-group"><input type="password" id="loginPassword" placeholder="Пароль"></div>
                    <button class="btn" onclick="login()">Войти</button>
                    <hr style="margin:20px 0"><div style="text-align:center"><strong>Нет аккаунта?</strong></div>
                    <div class="form-group"><input type="text" id="regUsername" placeholder="Логин"></div>
                    <div class="form-group"><input type="password" id="regPassword" placeholder="Пароль"></div>
                    <div class="form-group"><input type="text" id="regFirstName" placeholder="Имя"></div>
                    <div class="form-group"><input type="text" id="regLastName" placeholder="Фамилия"></div>
                    <button class="btn" onclick="register()">Зарегистрироваться</button>
                    <div id="authMessage" style="margin-top:16px;text-align:center"></div>
                </div>
            </div>
        `;
    }

    async function login() {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const msgDiv = document.getElementById('authMessage');
        const res = await apiCall('/login', 'POST', { username, password });
        if (res.success) {
            token = res.access_token; userId = res.user_id;
            localStorage.setItem('oldvk_token', token);
            localStorage.setItem('oldvk_user_id', userId);
            loadFeed();
        } else { msgDiv.innerHTML = '<span class="error">❌ Неверный логин/пароль</span>'; }
    }

    async function register() {
        const username = document.getElementById('regUsername').value;
        const password = document.getElementById('regPassword').value;
        const firstName = document.getElementById('regFirstName').value;
        const lastName = document.getElementById('regLastName').value;
        const msgDiv = document.getElementById('authMessage');
        const res = await apiCall('/register', 'POST', { username, password, first_name: firstName, last_name: lastName });
        if (res.success) {
            msgDiv.innerHTML = '<span class="success">✅ Регистрация успешна! Теперь войдите.</span>';
            document.getElementById('loginUsername').value = username;
            document.getElementById('loginPassword').value = password;
        } else { msgDiv.innerHTML = `<span class="error">❌ ${res.error}</span>`; }
    }

    async function loadStats() {
        const res = await apiCall('/users/search?q=');
        if (res.users) document.getElementById('statsWidget').innerHTML = `<div class="widget-title">📊 Статистика</div><div>Пользователей: ${res.users.length}</div>`;
    }

    if (token) { loadFeed(); loadStats(); } else { showAuthForm(); loadStats(); }
</script>
</body>
</html>
